{% extends 'base.html' %}

{% block title %}Edit trainer{% endblock %}

{% block content %}
    <div class="mx-auto max-w-2xl">
        <a href="{% url 'home' %}"
           class="text-sm font-semibold text-indigo-700 hover:underline">
            Back to trainers
        </a>

        <h1 class="mt-6 text-3xl font-bold tracking-tight">
            Edit trainer
        </h1>

        <p class="mt-2 text-slate-500">
            Update the details for {{ trainer }}.
        </p>

        <section class="panel mt-6">
            {% include "trainers/_form.html" with submit_label="Save changes" %}
        </section>
    </div>
{% endblock %}
