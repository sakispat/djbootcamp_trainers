{% extends 'base.html' %}

{% block title %}Delete trainer{% endblock %}

{% block content %}
    <section class="panel mx-auto max-w-xl">
        <p class="text-sm font-semibold text-red-600">
            DELETE TRAINER
        </p>

        <h1 class="mt-3 text-2xl font-bold">
            Remove {{ trainer }}?
        </h1>

        <p class="mt-3 text-slate-600">
            This trainer will be permanently deleted.
            This action cannot be undone.
        </p>

        <form method="post" class="mt-6 flex flex-wrap gap-3">
            {% csrf_token %}

            <button type="submit" class="btn-danger">
                Delete trainer
            </button>

            <a href="{% url 'home' %}" class="btn-secondary">
                Cancel
            </a>
        </form>
    </section>
{% endblock %}
