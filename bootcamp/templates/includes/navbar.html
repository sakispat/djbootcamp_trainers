<aside class="bg-slate-950 p-6 text-slate-200">
    <a href="{% url 'home' %}" class="block">
        <span class="text-xs font-bold uppercase tracking-widest text-indigo-400">
            Academy workspace
        </span>

        <span class="mt-2 block text-2xl font-bold text-white">
            Bootcamp.
        </span>
    </a>

    {% with current=request.resolver_match.url_name %}
        <nav aria-label="Main navigation"
             class="mt-8 flex flex-wrap gap-2 lg:flex-col">

            <a href="{% url 'home' %}"
               {% if current == "home" %}aria-current="page"{% endif %}
               class="rounded-lg px-4 py-3 text-sm font-semibold transition
                      {% if current == 'home' %}
                          bg-indigo-600 text-white
                      {% else %}
                          hover:bg-slate-800 hover:text-white
                      {% endif %}">
                All trainers
            </a>

            <a href="{% url 'create_trainer' %}"
               {% if current == "create_trainer" %}aria-current="page"{% endif %}
               class="rounded-lg px-4 py-3 text-sm font-semibold transition
                      {% if current == 'create_trainer' %}
                          bg-indigo-600 text-white
                      {% else %}
                          hover:bg-slate-800 hover:text-white
                      {% endif %}">
                Add trainer
            </a>
        </nav>
    {% endwith %}

    <form action="{% url 'search' %}"
          method="get"
          role="search"
          class="mt-8">

        <label for="nav-search"
               class="mb-2 block text-sm font-medium text-slate-300">
            Search by surname
        </label>

        <input id="nav-search"
               type="search"
               name="q"
               value="{{ query|default_if_none:'' }}"
               placeholder="Last name..."
               class="w-full rounded-lg border border-slate-700
                      bg-slate-900 px-3 py-2.5 text-sm text-white
                      placeholder:text-slate-500
                      focus:border-indigo-400 focus:outline-none
                      focus:ring-2 focus:ring-indigo-400">

        <button type="submit"
                class="mt-3 w-full rounded-lg bg-indigo-600
                       px-4 py-2.5 text-sm font-semibold text-white
                       hover:bg-indigo-500">
            Search
        </button>
    </form>

    <p class="mt-8 text-xs leading-6 text-slate-400">
        Keep your teaching team organized.
    </p>
</aside>
