{% load static %}
<!DOCTYPE html>
    <html lang="en">
    <head>
        <title>{% block title %}Trainers{% endblock %} | Bootcamp</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="{% static 'css/main.css' %}">
        {% block extra_css %}{% endblock %}
    </head>
    <body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
        <a href="#main-content" class="sr-only focus:not-sr-only focus:block focus:bg-white focus:p-4">
            Skip to content
        </a>

        <div class="min-h-screen lg:grid lg:grid-cols-[240px_1fr]">
            {% include "includes/navbar.html" %}

            <div class="min-w-0">
                <header class="border-b border-slate-200 bg-white px-6 py-5">
                    <p class="text-sm font-medium text-slate-500">
                        Bootcamp / Trainer management
                    </p>
                </header>

                <main id="main-content"
                    class="mx-auto max-w-6xl p-4 sm:p-8">
                    {% include "includes/messages.html" %}

                    {% block content %}{% endblock %}
                </main>
            </div>
        </div>

        {% block extra_js %}{% endblock %}
    </body>
</html>
